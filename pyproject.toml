[project]
name = "ci-failure-analyzer"
version = "0.1.0"
description = "AI agent that diagnoses failed CI builds and posts one deduplicated alert per failure."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are added in the increment that first needs them
# (pydantic/pyyaml in 1.2, opentelemetry-sdk in 1.7, strands-agents in 1.9, ...).
dependencies = [
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Python sources only; don't reformat code blocks in Markdown docs (e.g. the plan).
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = ["agent", "guardrails", "adapters", "evals", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true

# Strict checking for the core packages (design rule: agent/, guardrails/, adapters/).
# `strict = true` is global-only in mypy, so the strict flag set is spelled out here.
[[tool.mypy.overrides]]
module = ["agent.*", "guardrails.*", "adapters.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
