category: memory
specialist: infra
status: diagnosed
evidence_sources: ["log", "pom.xml"]
key_facts:
  - "test JVM heap is capped at 32m via the Surefire argLine"
  - "Spring context loading in tests exceeds that heap, causing OutOfMemoryError"
  - "passes locally because the IDE/default JVM heap is larger than the CI-configured forks"
fix_should_build: true        # raise the heap (e.g. -Xmx512m) or remove the cap

by_log:
  gradle.log:
    # The real job log shows an explicit OOM in :test (line 543) before the job hung
    # and was cancelled (line 550), so this is a confident diagnosis, not a hedge.
    evidence_sources: ["log", "build.gradle"]
    key_facts:
      - "test JVM heap is capped at maxHeapSize = '32m' (maxParallelForks = 2) in build.gradle"
      - "Spring context loading in PetClinicIntegrationTests fails with OutOfMemoryError during :test"
      - "the build then hung after the OOM until the job was cancelled; the cancellation is a symptom, not the cause"
      - "passes locally because tests run with the default heap, not the CI-configured limit"